/* --- 사용자 요청 반영: 전체 글씨 크게 / 추가 화면 스타일 --- */
body{font-size:18px}
.eyebrow{font-size:15px}
h1{font-size:clamp(28px,2.9vw,40px)}
header p,.headline p{font-size:17px}
.mini-pill,.time,.panel-heading small,.field-label,.small-txt,.note,.sm-muted,.history,.footnote{font-size:15px}
.tab,.btn,.hint-line,.info-line,.result-tile,.checkline{font-size:16px}
.btn.small,.select-btn{font-size:15px}
.panel-heading h3{font-size:20px}
.prompt{font-size:19px}
.answer-field,.option-select{font-size:17px}
.figcard label,.legend{font-size:15px}
.area-table,.data-table{font-size:15px}
.math-input{font-size:23px}
.formula{font-size:31px}
.formula small{font-size:15px}
.theorem-shell{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,.75fr);gap:18px;align-items:start}
.theorem-card{background:#f6fbfa;border:1px solid #cfe8df;border-radius:18px;padding:22px}
.theorem-card h4{font-size:24px;margin-bottom:12px;color:#0b7d72}
.theorem-card p{font-size:18px;color:#294558;margin-bottom:12px}
.theorem-formula{font:italic 700 42px Georgia,'Times New Roman',serif;color:#1b5278;text-align:center;margin:16px 0}
.theorem-mini{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.theorem-pill{background:#eaf6ff;border:1px solid #d1e6f7;color:#355774;border-radius:999px;padding:8px 12px;font-size:15px;font-weight:800}
@media(max-width:1090px){.theorem-shell{grid-template-columns:1fr}}


/* 교과서 228쪽 8조각 재배치 활동 */
.puzzle-mission{font-size:17px;line-height:1.65;background:#edf8f3;border-left:4px solid #18a38e;padding:13px 16px;border-radius:8px;margin-bottom:14px}
.puzzle-visual{width:100%;display:block;touch-action:none;user-select:none;border:1px solid #dce9ef;border-radius:15px;background:linear-gradient(180deg,#fcfefa,#f7fafc);max-height:720px}
.puzzle-piece{cursor:grab;touch-action:none;filter:drop-shadow(0px 2px 2px rgba(32,58,82,.18))}
.puzzle-piece:active{cursor:grabbing}
.puzzle-piece polygon{stroke:#294b57;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.puzzle-piece.is-selected polygon{stroke:#036b65;stroke-width:4}
.puzzle-piece.is-placed{filter:none}
.puzzle-handle{cursor:crosshair;touch-action:none}
.puzzle-handle circle{fill:#fff;stroke:#087d77;stroke-width:3}
.puzzle-handle text{font-size:21px;fill:#087d77;font-weight:900;text-anchor:middle;pointer-events:none}
.puzzle-tip{margin:12px 0;padding:10px 13px;border-radius:10px;background:#f5f8fb;border:1px solid #e1eaf3;color:#4b6478;font-size:16px}
.puzzle-key{display:flex;gap:12px;flex-wrap:wrap;font-size:15px;color:#455c72}
.puzzle-key b{border-radius:4px;padding:2px 7px;font-weight:850}
.puzzle-score{font-size:19px;color:#086f65;font-weight:850}
.puzzle-target-guide{pointer-events:none}
@media(max-width:700px){.puzzle-visual{max-height:570px}.puzzle-mission{font-size:16px}.puzzle-tip{font-size:15px}}

/* 교실 순회 확인용: 현재 기기에서만 보이는 학습 현황 사이드바 */
.shell-with-progress{max-width:1800px;display:grid;grid-template-columns:minmax(0,1fr) 284px;column-gap:18px;align-items:start}
.workspace-main{min-width:0}
.learning-progress{position:sticky;top:14px;padding:18px 16px 17px;max-height:calc(100vh - 28px);overflow:auto}
.lp-title{font-size:21px;font-weight:900;letter-spacing:-.04em}
.lp-context{font-size:13px;color:#77869a;margin:0 0 14px}
.lp-summary{display:flex;align-items:baseline;gap:7px;margin-bottom:10px}
.lp-count{font-size:38px;font-weight:900;color:#087e7a;letter-spacing:-.06em;line-height:1}
.lp-count-text{font-size:16px;color:#576b80;font-weight:750}
.lp-bar{height:12px;background:#e6edf4;border-radius:99px;overflow:hidden;margin:10px 0 7px}
.lp-bar-fill{height:100%;background:#159c91;border-radius:99px;transition:width .2s}
.lp-overall-label{font-size:14px;font-weight:700;color:#546981;margin-bottom:17px}
.lp-step-list{display:grid;gap:7px}
.lp-step{width:100%;text-align:left;background:#fafbfd;border:1px solid #e0e7f0;border-radius:10px;padding:10px 9px;display:flex;align-items:center;gap:9px;color:#354b61;min-height:54px;font:inherit;cursor:pointer}
.lp-step:hover{border-color:#9bcfc7}
.lp-step.is-current{background:#f0faf7;border-color:#25aa9b;box-shadow:inset 3px 0 #159c91}
.lp-step.is-complete{border-color:#c0e5db}
.lp-index{height:29px;width:29px;flex:none;border-radius:9px;display:grid;place-items:center;font-size:14px;font-weight:900;background:#e8eef5;color:#687a8e}
.lp-step.is-current .lp-index{background:#159c91;color:white}
.lp-step.is-complete .lp-index{background:#ddf5ec;color:#187755}
.lp-labels{flex:1;min-width:0}
.lp-labels strong{font-size:15px;display:block;line-height:1.24}
.lp-labels small{font-size:12px;display:block;color:#708196;margin-top:2px}
.lp-status{font-size:12px;font-weight:850;color:#7c8b99;white-space:nowrap}
.lp-step.is-current .lp-status{color:#05877b}
.lp-step.is-complete .lp-status{color:#20835c}
.lp-current{margin-top:14px;padding:13px;background:#f3f8fb;border:1px solid #e0e9ef;border-radius:11px}
.lp-current-title{font-size:14px;font-weight:850;color:#304960;margin-bottom:6px}
.lp-current-detail{font-size:14px;line-height:1.5;color:#526b80}
.lp-mini-bar{height:7px;background:#dfebf1;border-radius:99px;margin:10px 0 0;overflow:hidden}
.lp-mini-bar>div{height:100%;background:#72b6aa;border-radius:99px;transition:width .2s}
.lp-foot{color:#738298;font-size:12px;line-height:1.55;margin:12px 0 0}
@media(max-width:1430px){.shell-with-progress{grid-template-columns:minmax(0,1fr) 252px;gap:12px}.shell-with-progress .layout{grid-template-columns:minmax(0,1fr)}.learning-progress{padding:15px 12px}}
@media(max-width:850px){.shell-with-progress{grid-template-columns:1fr;gap:12px}.learning-progress{position:static;grid-row:1;max-height:none}.lp-step-list{grid-template-columns:repeat(2,minmax(0,1fr))}.lp-step{min-width:0}}
@media(max-width:550px){.lp-step-list{grid-template-columns:1fr}.lp-title{font-size:20px}.learning-progress{padding:14px}}
</style>

<body>
<header><div class="header-inner"><div class="header-top"><div><div class="eyebrow">MATH LAB · 중학교 2학년 7.5</div><h1>피타고라스의 비밀 <span style="color:#159c91">↗</span></h1><p>보고 → 움직이고 → 발견하고 → 설명하는 인터랙티브 수학 수업</p></div><div class="mini-pill">2차시 · 1인 1기기 · 로그인 불필요</div></div></div><nav class="tabs" id="tabs" aria-label="학습 단계"></nav></header>
<main class="shell shell-with-progress"><div class="workspace-main"><div class="headline"><div><span class="section-chip" id="section-chip"></span><h2 id="section-title"></h2><p id="section-subtitle"></p></div><div class="time" id="section-time"></div></div><div id="stage"></div><div class="nav-bottom"><button class="btn" id="prev-stage">← 이전 단계</button><span id="progress-text" class="small-txt"></span><button class="btn primary" id="next-stage">다음 단계 →</button></div><div class="footnote">동아출판 중학교 수학 2, 7.5 피타고라스 정리(222~228쪽)와 12번 프린트를 바탕으로 제작한 독립형 수업 도구입니다. 답안·개인정보를 외부로 전송하거나 영구 저장하지 않습니다. 퍼즐 활동은 피타고라스 정리와 닮음도형의 넓이 관계를 이해하도록 재구성했습니다.</div></div><aside class="learning-progress panel" id="learning-progress" aria-label="나의 학습 진행도" aria-live="off"></aside></main>
<script>
'use strict';
const NS='http://www.w3.org/2000/svg';
const TITLES=[['넓이의 비밀','직각삼각형의 세 정사각형을 비교해 봅시다.','1차시 · 역사 도입 5분 + 넓이 탐구 12분'],['피타고라스 정리','넓이 탐구로 찾은 규칙을 수식과 말로 정리해 봅시다.','1차시 · 정리 설명 4분'],['정리를 증명하라','합동인 네 삼각형을 옮겨 같은 넓이를 확인해 봅시다.','1차시 · 16분'],['대표 예제','직각을 낀 두 변의 길이를 이용해 빗변을 구해 봅시다.','1차시 · 8분'],['직각삼각형 판별','도형을 움직이고 세 변의 제곱을 비교해 봅시다.','2차시 · 복습 4분 + 탐구 21분'],['닮음도형 퍼즐','세 변 위 도형의 넓이 관계를 퍼즐로 다시 확인해 봅시다.','2차시 · 퍼즐 16분 + 정리 4분']];
const S={stage:0,done:[false,false,false,false,false,false],area:[[4,1,5,5],['','','',''],['','','','']],fig:0,showGrid:true,showSplit:false,hints:[0,0,0,0,0,0],messages:['','','','','',''],discovery:'',historyOpen:true,visited:[true,false,false,false,false,false],stage2:{pieces:[],selected:null,hintSlot:false,proofText:'',x1:'',x2:''},example:{step1:'',step2:'',step3:'',step4:'',showSolution:false},tri:{mode:'book',A:{x:490,y:115},B:{x:210,y:325},C:{x:490,y:325},grid:true,values:false,guess:'acute',records:{acute:null,right:null,obtuse:null},entries:{acute:{sum:'',long:'',op:''},right:{sum:'',long:'',op:''},obtuse:{sum:'',long:'',op:''}}},puzzle:{level:0,pieces:[],selected:null,showGhost:false,success:[false,false],reason:''}};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function message(m,type='good'){S.messages[S.stage]={m,type};renderMessage()}
function renderMessage(){let el=$('stage-message');if(el){const x=S.messages[S.stage];el.innerHTML=x?`<div class="student-msg ${x.type==='good'?'':x.type==='warn'?'warn':'bad'}" role="status">${esc(x.m)}</div>`:''}}
function pop(){const el=document.createElement('div');el.className='confetti';el.textContent='🎉 ✨ 🎊';document.body.appendChild(el);setTimeout(()=>el.remove(),950)}
function complete(i){if(!S.done[i]){S.done[i]=true;pop()}renderTabs();refreshProgressPanel()}

// 학습 현황: 완료는 정답 확인/설명 제출이 승인된 단계만 집계합니다.

const PROGRESS_LABELS=['넓이 발견','정리 확인','재배치 증명','대표 예제','삼각형 판별','8조각 퍼즐'];
function progressDetails(i){
 if(S.done[i])return{fraction:1,detail:'활동을 확인하고 완료했습니다.'};
 if(i===0){
  const filled=S.area.slice(1).flat().filter(v=>v!==''&&String(v).trim()!=='').length;
  const textDone=S.discovery.trim().length>0;
  return{fraction:(filled+(textDone?1:0))/9,detail:`넓이표 ${filled}/8칸 작성 · 규칙 설명 ${textDone?'작성 중':'미작성'}`};
 }
 if(i===1)return{fraction:0,detail:'피타고라스 정리 읽고 「정리 이해했어요」 누르기'};
 if(i===2){
  const placed=S.stage2.pieces.filter(v=>v.slot>=0).length;
  const inputs=Number(S.stage2.x1!=='')+Number(S.stage2.x2!=='');
  const reason=Number(S.stage2.proofText.trim().length>0);
  return{fraction:(placed+inputs+reason)/7,detail:`삼각형 ${placed}/4개 배치 · 넓이 ${inputs}/2칸 · 설명 ${reason?'작성 중':'미작성'}`};
 }
 if(i===3){const n=Object.entries(S.example).filter(([key,val])=>/^step[1-4]$/.test(key)&&String(val).trim()!=='').length;
  return{fraction:n/4,detail:`예제 풀이 ${n}/4칸 작성`};}
 if(i===4){const n=Object.values(S.tri.records).filter(Boolean).length;
  const partial=Object.values(S.tri.entries).some(row=>row.sum!==''||row.long!==''||row.op!=='');
  return{fraction:Math.min(.95,(n+(!n&&partial?.2:0))/3),detail:`삼각형 ${n}/3종 정답 확인${partial&&n<3?' · 표 작성 중':''}`};}
 if(i===5){const placed=S.puzzle.pieces.filter(x=>x.slot>=0).length;
  const described=S.puzzle.reason.trim().length>0;
  return{fraction:Math.min(.95,(placed+(described?1:0))/9),detail:`퍼즐 조각 ${placed}/8개 맞춤 · 설명 ${described?'작성 중':'미작성'}`};}
 return{fraction:0,detail:''};
}

function areaSVG(fig){const a=[2,2,3][fig],b=[1,2,2][fig],sc=35;const B={x:105,y:200},C={x:105+a*sc,y:200},A={x:C.x,y:C.y-b*sc};const off={x:-b*sc,y:-a*sc};const poly=pts=>pts.map(p=>`${p.x},${p.y}`).join(' ');const p=(x,y)=>({x,y});let grid='';for(let x=0;x<=300;x+=sc)grid+=`<line x1="${x}" y1="0" x2="${x}" y2="320" stroke="#d8e0e9" stroke-width=".85"/>`;for(let y=25;y<=320;y+=sc)grid+=`<line x1="0" y1="${y}" x2="300" y2="${y}" stroke="#d8e0e9" stroke-width=".85"/>`;const g1=poly([B,C,p(C.x,C.y+a*sc),p(B.x,B.y+a*sc)]),g2=poly([C,A,p(A.x+b*sc,A.y),p(C.x+b*sc,C.y)]),g3=poly([B,A,p(A.x+off.x,A.y+off.y),p(B.x+off.x,B.y+off.y)]);const clipped=pid=>`<g opacity=".38" clip-path="url(#${pid})">${grid}</g>`;

function renderArea(){return `<div class="layout"><section class="panel"><div class="panel-heading"><h3>모눈에서 넓이를 찾아보세요</h3><div class="mini-tabs"><button class="btn small ${S.showGrid?'soft':''}" id="toggle-grid">모눈 ${S.showGrid?'ON':'OFF'}</button><button class="btn small" id="toggle-split">보조선 ${S.showSplit?'숨기기':'보기'}</button></div></div><div class="stage-body"><div class="hint-line"><strong>핵심 안내</strong> — 모눈 한 칸은 넓이가 1인 정사각형입니다. 기울어진 정사각형은 보조선으로 나누어 계산할 수 있어요.</div><div class="grid-cards">${[0,1,2].map(i=>`<div class="figcard ${S.fig===i?'active':''}" data-fig="${i}" role="button" tabindex="0">${areaSVG(i)}<label>[그림 ${i+1}]</label></div>`).join('')}</div><div class="info-line">세 그림 모두 <strong>직각삼각형의 세 변 위에 만든 정사각형</strong>입니다. ㉮, ㉯, ㉰의 넓이를 구해 보세요. (그림 1은 연습용 정답이 미리 들어 있습니다.)</div><div class="legend"><span><span class="dot" style="background:#ffe0a9"></span>㉮: BC 위</span><span><span class="dot" style="background:#efc5c4"></span>㉯: CA 위</span><span><span class="dot" style="background:#b8ded8"></span>㉰: AB 위</span></div></div></section><aside class="panel"><div class="panel-heading"><h3>탐구 활동 기록</h3><small>교과서 222쪽</small></div><div class="aside-body"><details ${S.historyOpen?'open':''} id="history-details"><summary style="cursor:pointer;font-weight:800;color:#126d75">📜 수학사 이야기: 직각의 비밀</summary><p class="small-txt" style="margin:10px 0">고대의 건축과 측량에서는 정확한 직각이 필요했습니다. 교과서에는 12등분한 매듭 끈으로 길이가 3, 4, 5인 삼각형을 만들어 직각을 확인하는 이야기가 나옵니다.</p><p class="small-txt"><strong>질문:</strong> 각도기가 없어도 세 변의 길이만으로 직각인지 판단할 수 있을까요?</p><p class="note">이 이야기는 수학사의 도입 소재이며, 특정 인물이 처음 증명했다는 뜻은 아닙니다.</p></details><p class="prompt">1. 다음 표를 완성해 보세요.</p><table class="area-table"><thead><tr><th>그림</th><th>㉮</th><th>㉯</th><th>㉰</th><th>㉮+㉯</th></tr></thead><tbody>${[0,1,2].map(i=>`<tr><td>${i+1}</td>${[0,1,2,3].map(j=>`<td><input type="number" data-area="${i},${j}" value="${esc(S.area[i][j])}" aria-label="그림${i+1}, ${['가','나','다','가 더하기 나'][j]}의 넓이"></td>`).join('')}</tr>`).join('')}</tbody></tab function theoremIntroSVG(){return `<svg class="svg-stage" viewBox="0 0 900 360" aria-label="피타고라스 정리 설명 그림" style="max-height:320px"><rect x="24" y="24" width="852" height="312" rx="24" fill="#f8fbfa" stroke="#d4e5df"/><g transform="translate(60 56)"><text x="0" y="0" font-size="42" font-weight="900" fill="#0b7f73">피타고라스 정리</text><text x="0" y="58" font-size="22" fill="#294558">직각삼각형에서 직각을 낀 두 변의 길이를 각각 a, b라 하고,</text><text x="0" y="98" font-size="22" fill="#294558">빗변의 길이를 c라 하면</text><text x="165" y="176" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="54" font-weight="700" fill="#1b5278">a² + b² = c²</text><text x="0" y="230" font-size="22" fill="#294558">즉, 작은 두 정사각형의 넓이의 합 = 큰 정사각형의 넓이입니다.</text></g><g transform="translate(610 58)"><path d="M18 178 L238 178 L238 38 Z" fill="#edf3f6" stroke="#333" stroke-width="2.4"/><path d="M214 178 v-22 h24" fill="none" stroke="#d96d90" stroke-width="3"/><text x="127" y="204" font-size="30" font-family="Georgia,serif" font-style="italic" fill="#2b4c65">a</text><text x="252" y="116" font-size="30" font-family="Georgia,serif" font-style="italic" fill="#2b4c65">b</text><text x="116" y="80" font-size="30" font-family="Georgia,serif" font-style="italic" fill="#2b4c65">c</text><path d="M18 178 Q115 122 238 38" stroke="#7b8796" stroke-width="2" fill="none" stroke-dasharray="6 5"/><path d="M18 178 Q136 216 238 178" stroke="#7b8796" stroke-width="2" fill="none" stroke-dasharray="6 5"/><path d="M238 38 Q279 112 238 178" stroke="#7b8796" stroke-width="2" fill="none" stroke-dasharray="6 5"/></g></svg>`}
function renderTheorem(){return `<div class="panel"><div class="panel-heading"><h3>넓이 탐구 뒤, 정리를 한 문장으로 정리해 봅시다</h3><small>교과서 223쪽 개념 정리</small></div><div class="stage-body"><div class="theorem-shell"><div><div class="theorem-card"><h4>직각삼각형의 세 변 사이의 관계</h4><p>앞 단계에서 세 그림 모두 <strong>작은 두 정사각형의 넓이의 합 = 큰 정사각형의 넓이</strong>라는 공통점을 찾았습니다.</p><p>이를 변의 길이로 나타내면, 직각삼각형에서 직각을 낀 두 변의 길이를 각각 <span class="math">a, b</span>, 빗변의 길이를 <span class="math">c</span>라 할 때 다음이 성립합니다.</p><div class="theorem-formula">a² + b² = c²</div><p>이 성질을 <strong>피타고라스 정리</strong>라고 합니다. 다음 단계에서는 왜 항상 성립하는지 네 개의 합동인 직각삼각형을 재배치해 증명해 봅니다.</p><div class="theorem-mini"><span class="theorem-pill">a² = 한 변이 a인 정사각형의 넓이</span><span class="theorem-pill">b² = 한 변이 b인 정사각형의 넓이</span><span class="theorem-pill">c² = 한 변이 c인 정사각형의 넓이</span></div><div class="button-row"><button class="btn primary" id="theorem-done">정리 이해했어요</button><button class="btn" id="next-stage-inline" data-stage="2">재배치 증명으로 가기 →</button></div></div></div><div>${theoremIntroSVG()}<div class="info-line">중요: 피타고라스 정리는 <strong>직각삼각형에서만</strong> 바로 사용할 수 있습니다. 따라서 먼저 직각삼각형인지 확인하거나, 직각삼각형이라는 조건이 주어졌는지 살펴봐야 합니다.</div></div></div><div id="stage-message"></div></div></div>`}

function proofSVG(){const u=PR.unit,L=7*u,ls=PR.source,rt=PR.target;const sq=(x,y,w,h,color,label)=>`<rect x="${ls.x+x*u}" y="${ls.y+y*u}" width="${w*u}" height="${h*u}" fill="${color}" stroke="#aac1cd" stroke-width="1.5"/>${svgText(ls.x+(x+w/2)*u,ls.y+(y+h/2)*u+7,label)}`;

function renderTri(){let t=S.tri,st=triStatistics(),done=Object.values(t.records).filter(Boolean).length;return `<div class="layout"><section class="panel"><div class="panel-heading"><h3>알지오매스처럼 꼭짓점을 움직여 보세요</h3><small>교과서 225쪽</small></div><div class="stage-body"><div class="seg-tools"><div class="mini-tabs"><button class="select-btn ${t.mode==='book'?'active':''}" data-mode="book">교과서 모드</button><button class="select-btn ${t.mode==='free'?'active':''}" data-mode="free">자유 탐구 모드</button></div><div class="button-row" style="margin:0"><button class="btn small ${t.grid?'soft':''}" id="tri-grid">모눈 ${t.grid?'ON':'OFF'}</button><button class="btn small ${t.values?'soft':''}" id="tri-values">제곱값 ${t.values?'숨기기':'보기'}</button><button class="btn small" id="tri-reset">삼각형 초기화</button></div></div><svg class="svg-stage" id="tri-svg" viewBox="0 0 780 450" aria-label="꼭짓점 A B C를 움직이는 삼각형" style="max-height:490px">${triInner()}</svg>${t.mode==='book'?`<div class="button-row"><span class="small-txt" style="align-self:center">AB 길이를 빠르게 설정:</span>${[4,5,6].map(n=>`<button class="btn small" data-ab="${n}">AB = ${n}</button>`).join('')}</div><div class="info-line">BC=4, CA=3을 유지합니다. 점 A는 C를 중심으로 하는 원호 위를 움직여요. 세 변의 길이가 정해지면 삼각형의 각도도 정해집니다.</div>`:`<div class="info-line">세 점을 자유롭게 움직여 보세요. 모눈 교점에 맞추면 제곱값을 계산하기 편합니다. <strong>c는 항상 가장 긴 변의 길이</strong>로 정합니다.</div>`}<div class="legend"><span>● 이동 가능한 꼭짓점</span><span>모눈 1칸 = ${t.mode==='book'?'1':'1'} 길이단위</span></div></div></section><aside class="panel"><div class="panel-heading"><h3>세 변의 제곱 비교</h3><small>탐구 기록 ${done}/3</small></div><div class="aside-body"><p class="small-txt">현재 도형의 종류를 먼저 예상하고, <strong>짧은 두 변의 제곱의 합(a²+b²)</strong>과 <strong>가장 긴 변의 제곱(c²)</strong>을 계산해 표에 입력하세요.</p><p class="prompt">1. 만들고 싶은 삼각형 선택</p><div class="mini-tabs">${Object.entries(CLASS_NAME).map(([k,v])=>`<button class="select-btn ${t.guess===k?'active':''}" data-guess="${k}">${v}${t.records[k]?' ✓':''}</button>`).join('')}</div><p class="prompt">2. 제곱값 const PE_PIECES=[
 {name:'노랑 ①',color:'#ffe064',original:[peSt,peSl,peSm1],target:[peTR,peU,peY],rot:0},
 {name:'빨강 ①',color:'#f15e4f',original:[peSt,peP,peSm1],target:[peTR,peU,peD],rot:90},
 {name:'빨강 ②',color:'#f15e4f',original:[peSl,peSm2,peB],target:[peV,peX,peBL],rot:90},
 {name:'노랑 ②',color:'#ffe064',original:[peP,peSm2,peB],target:[peV,peW,peBL],rot:0},
 {name:'파랑 ①',color:'#469cda',original:[peP,peBt,peBu],target:[peU,peTL,peD],rot:-90},
 {name:'초록 ①',color:'#47b359',original:[peBt,peBr,peBu],target:[peTL,peU,peW],rot:0},
 {name:'초록 ②',color:'#47b359',original:[peP,peQ,peBv],target:[peV,peBR,peY],rot:0},

];
const peAverage=poly=>[poly.reduce((a,v)=>a+v[0],0)/poly.length,poly.reduce((a,v)=>a+v[1],0)/poly.length];

function renderPuzzle(){let placed=S.puzzle.pieces.filter(p=>p.slot>=0).length,selected=S.puzzle.selected,success=S.puzzle.success[0];return `<div class="layout"><section class="panel"><div class="panel-heading"><h3>수학 실험실 · 교과서의 8조각 퍼즐</h3><small>교과서 228쪽 · 방법 그림</small></div><div class="stage-body"><div class="puzzle-mission"><strong>방법</strong> · 직각을 낀 두 변 위의 작은 정사각형에서 색깔 삼각형 8개를 꺼내, 빗변 위 큰 정사각형을 <strong>빈틈없이 채워 보세요.</strong></div><div class="seg-tools"><div class="button-row" style="margin:0"><button class="btn" id="puzzle-left" ${selected===null?'disabled':''}>↶ 90° 회전</button><button class="btn" id="puzzle-right" ${selected===null?'disabled':''}>↷ 90° 회전</button><button class="btn soft" id="puzzle-restore" ${selected===null?'disabled':''}>선택 조각 원위치</button><button class="btn" id="puzzle-reset">전체 초기화</button></div></div>${puzzleSVG()}<div class="puzzle-tip">삼각형을 눌러 선택하고 끌어 옮기세요. 선택한 조각의 <strong>⟳ 손잡이</strong>를 드래그하거나 회전 버튼을 눌러 방향을 바꿀 수 있습니다. 올바른 자리와 방향에 가까워지면 자동으로 맞춰집니다.</div><div class="puzzle-key"><span><b style="background:#ffe064">노랑 2</b></span><span><b style="background:#f15e4f;color:white">빨강 2</b></span><span><b style="background:#469cda;color:white">파랑 2</b></span><span><b style="background:#47b359;color:white">초록 2</b></span></div></div></section><aside class="panel"><div class="panel-heading"><h3>넓이 보존 실험</h3><small>조각 ${placed}/8개 완성</small></div><div class="aside-body"><p class="prompt">1. 작은 두 정사각형의 조각을 옮기세요.</p><div class="hint-line">왼쪽 작은 정사각형의 넓이는 <b>4</b>, 위쪽 큰 정사각형의 넓이는 <b>12</b>입니다. 아래 빈 정사각형의 넓이는 <b>16</b>입니다.</div><p class="prompt">2. 퍼즐 진행 상황</p><div class="puzzle-score">${placed} / 8개 조각 맞춤</div><div style="background:#e4edf2;border-radius:99px;height:12px;overflow:hidden;margin:10px 0"><div style="width:${placed/8*100}%;height:100%;background:#0eaa94;transition:width .2s"></div></div><div class="button-row"><button class="btn amber" id="hint">힌트 ${S.hints[5]}/3</button><button class="btn soft" id="puzzle-outline" ${selected===null?'dis function rotatePiece(kind,delta){
 if(kind==='puzzle'){
  const id=S.puzzle.selected;if(id===null){message('먼저 회전할 삼각형을 선택해 주세요.','warn');return}

 }
 const group=S.stage2,id=group.selected;
 if(id===null){message('먼저 회전할 조각을 선택해 주세요.','warn');return}
 const p=group.pieces[id],unit=PR.unit;
 const vertices=triLocal;
 const center={x:vertices.reduce((a,v)=>a+v[0],0)/vertices.length*unit,y:vertices.reduce((a,v)=>a+v[1],0)/vertices.length*unit};
 const rotPoint=a=>{const rad=a*Math.PI/180;return{x:center.x*Math.cos(rad)-center.y*Math.sin(rad),y:center.x*Math.sin(rad)+center.y*Math.cos(rad)}};
 const before=rotPoint(p.rot),after=rotPoint(p.rot+delta);

}

function finishTri(){let t=S.tri,st=triStatistics(),which=t.guess,en=t.entries[which];if(!st.valid){message('꼭짓점이 일직선에 가깝습니다. 삼각형을 다시 만들어 보세요.','warn');return}if(st.type!==which){message(`현재 도형은 선택한 ${CLASS_NAME[which]}의 조건을 만족하지 않습니다. 꼭짓점을 더 움직여 보세요.`,'warn');return}if(en.sum===''||en.long===''||!en.op){message('선택한 삼각형의 a²+b², c²과 대소 기호를 모두 입력해 주세요.','warn');return}if(Math.abs(Number(en.sum)-st.sum)>Math.max(.11,st.sum*.005)||Math.abs(Number(en.long)-st.long)>Math.max(.11,st.long*.005)){message('입력한 제곱값이 현재 삼각형의 변의 길이와 맞지 않습니다. 「제곱값 보기」로 다시 계산해 보세요.','warn');return}if(en.op!==CLASS_OP[which]){message('두 값을 비교하는 부등호(또는 등호)를 다시 확인해 보세요.','warn');return}t.records[which]={sum:fmt(st.sum),long:fmt(st.long),op:en.op};if(Object.values(t.records).every(Boolean)){complete(4);message('예각·직각·둔각삼각형을 모두 탐구했어요! 특히 a²+b²=c²이면 직각삼각형입니다.')}else message(`${CLASS_NAME[which]}의 탐구 결과를 기록했어요! 다른 종류도 만들어 보세요.`);render()}

function svgPoint(svg,e){const ctm=svg.getScreenCTM();if(!ctm)return{x:0,y:0};let p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(ctm.inverse())}
function proofCandidate(p){let slots=proofSlots;let best=null;for(let i=0;i<slots.length;i++){let q=slots[i];if(S.stage2.pieces.some(o=>o!==p&&o.slot===i))continue;if(normalizeAngle(p.rot)!==q.rot)continue;let tx=PR.target.x+q.x*PR.unit,ty=PR.target.y+q.y*PR.unit,err=Math.hypot(p.x-tx,p.y-ty);if(err<53&&(!best||err<best.err))best={index:i,x:tx,y:ty,err}}return best}
function puzzleCandidate(piece,index){
 const d=PE_PIECES[index],point=peTargetCenter(d);
 let err=Math.abs(((normalizeAngle(piece.rot)-normalizeAngle(d.rot)+540)%360)-180);
 if(err>13)return null;
 const dist=Math.hypot(piece.x-point.x,piece.y-point.y);
 return dist<45?{index,x:point.x,y:point.y,rot:normalizeAngle(d.rot)}:null
}
function bindPieceEvents(kind){if(kind==='puzzle'){bindPuzzleEvents();return;}const svg=$(kind==='proof'?'proof-svg':'puzzle-svg');if(!svg)return;let group=kind==='proof'?S.stage2:S.puzzle;let dragging=null,moved=false,last={x:0,y:0};
svg.addEventListener('pointerdown',e=>{let el=e.target.closest('.piece');if(!el||!svg.contains(el))return;let index=Number(el.dataset.piece);group.selected=index;dragging={id:index,el};moved=false;last=svgPoint(svg,e);svg.setPointerCapture(e.pointerId);svg.querySelectorAll('.piece').forEach(g=>g.classList.toggle('selected',Number(g.dataset.piece)===index));e.preventDefault()});
svg.addEventListener('pointermove',e=>{if(!dragging)return;let pt=svgPoint(svg,e),delta={x:pt.x-last.x,y:pt.y-last.y};last=pt;if(Math.hypot(delta.x,delta.y)<.05)return;let p=group.pieces[dragging.id];p.x+=delta.x;p.y+=delta.y;p.slot=-1;moved=true;dragging.el.setAttribute('transform',`translate(${p.x} ${p.y}) rotate(${p.rot})`);e.preventDefault()});
const end=e=>{if(!dragging)return;let p=group.pieces[dragging.id];if(moved){let c=proofCandidate(p);if(c){p.x=c.x;p.y=c.y;p.slot=c.index;if(kind==='proof'&&group.pieces.every(z=>z.slot>=0))message('네 삼각형을 모두 배치했어요! 남은 넓이의 관계를 설명해 봅시다.'); }}
  dragging=null;render()};svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end)}
function bindPuzzleEvents(){

 svg.addEventListener('pointerdown',e=>{
  const el=e.target.closest('.puzzle-piece');if(!el||!svg.contains(el))return;
  const index=Number(el.dataset.piece);S.puzzle.selected=index;
  const part=S.puzzle.pieces[index];
  const p=svgPoint(svg,e),isHandle=!!e.target.closest('.puzzle-handle');
  drag={index,el,mode:isHandle?'rotate':'move'};pointBefore=p;moved=false;
  if(isHandle){angleBefore=Math.atan2(p.y-part.y,p.x-part.x);rotationBefore=part.rot}
  svg.setPointerCapture(e.pointerId);
  svg.querySelectorAll('.puzzle-piece').forEach(g=>g.classList.toggle('is-selected',Number(g.dataset.piece)===index));
  e.preventDefault();
 });
 svg.addEventListener('pointermove',e=>{
  if(!drag)return;
  const now=svgPoint(svg,e),part=S.puzzle.pieces[drag.index];
  if(drag.mode==='move'){
    const dx=now.x-pointBefore.x,dy=now.y-pointBefore.y;
    part.x+=dx;part.y+=dy;
  }else{
    const a=Math.atan2(now.y-part.y,now.x-part.x);
    part.rot=normalizeAngle(rotationBefore+(a-angleBefore)*180/Math.PI);
  }
  pointBefore=now;moved=true;part.slot=-1;S.puzzle.success[0]=false;
  drag.el.setAttribute('transform',`translate(${part.x} ${part.y}) rotate(${part.rot})`);
  e.preventDefault();
 });
 const end=e=>{
  if(!drag)return;
  const ix=drag.index,p=S.puzzle.pieces[ix];
  if(moved){const match=puzzleCandidate(p,ix);if(match){p.x=match.x;p.y=match.y;p.rot=match.rot;p.slot=ix;
   if(S.puzzle.pieces.every(z=>z.slot>=0)){S.puzzle.success[0]=true;pop();message('교과서 퍼즐 완성! 작은 두 정사각형의 조각 8개가 큰 정사각형을 정확히 채웠어요.');}
  }}
  drag=null;render();
 };
 svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
}
function bindTriEvents(){let svg=$('tri-svg');if(!svg)return;let vertex=null,last={x:0,y:0};svg.addEventListener('pointerdown',e=>{let el=e.target.closest('[data-vertex]');if(!el)return;let v=el.dataset.vertex;if(S.tri.mode==='book'&&v!=='A')return;vertex=v;last=svgPoint(svg,e);svg.setPointerCapture(e.pointerId);e.preventDefault()});
svg.addEventListener('pointermove',e=>{if(!vertex)return;let p=svgPoint(svg,e),t=S.tri;if(t.mode==='book'){let a=Math.atan2(p.y-t.C.y,p.x-t.C.x);a=Math.max(-Math.PI+.04,Math.min(-.04,a));t.A={x:t.C.x+210*Math.cos(a),y:t.C.y+210*Math.sin(a)}}else{t[vertex]={x:Math.max(35,Math.min(745,p.x)),y:Math.max(35,Math.min(415,p.y))}}svg.innerHTML=triInner();e.preventDefault()});
const end=()=>{if(!vertex)return;let t=S.tri;if(t.mode==='free'&&t.grid){let v=t[vertex];v.x=70+Math.round((v.x-70)/35)*35;v.y=45+Math.round((v.y-45)/35)*35}vertex=null;t.values=false;render()};svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end)}
render();
</script></body></html>
